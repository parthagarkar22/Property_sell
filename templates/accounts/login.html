{% extends "base.html" %}

{% block title %}Login — Vidarbha Properties{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card">
    <h1 data-i18n="login_title">Login</h1>
    <p class="hint" data-i18n="login_hint">Enter your mobile number and password.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="phone" data-i18n="label_phone">Mobile number</label>
        <input type="tel" id="phone" name="phone" value="{{ phone|default:'' }}" required
               inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"
               autocomplete="tel" data-i18n-placeholder="ph_phone" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label for="password" data-i18n="label_password">Password</label>
        <div class="pw-field">
          <input type="password" id="password" name="password" required
                 autocomplete="current-password" data-i18n-placeholder="ph_password_login" placeholder="Your password">
          {% include "includes/password_toggle.html" with target="password" %}
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_login">Login</button>
    </form>
    <p class="help-tip">
      <span data-i18n="new_user">New user?</span>
      <a href="{% url 'accounts:register' %}?next={{ next|urlencode }}" data-i18n="register_here">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
